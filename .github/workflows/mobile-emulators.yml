name: mobile-emulators

# Roda o fluxo de demonstração dos dois apps no emulador Android e no
# simulador iOS e publica as capturas de tela como artefatos.
on:
  workflow_dispatch:
  pull_request:
    paths: ['mobile/**', '.github/workflows/mobile-emulators.yml']

concurrency:
  group: mobile-emulators-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.47.5'

jobs:
  android:
    name: Emulador Android (${{ matrix.app }})
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        app: [oficina, entregador]
    steps:
      - uses: actions/checkout@v4
      - name: Habilitar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
        working-directory: mobile
      - name: Fluxo de demonstração no emulador
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_7
          disable-animations: true
          working-directory: mobile/apps/${{ matrix.app }}
          script: flutter drive --driver=test_driver/integration_test.dart --target=integration_test/demo_flow_test.dart -d emulator-5554
      - name: Capturas reduzidas no log (revisão remota)
        if: always()
        working-directory: mobile/apps/${{ matrix.app }}
        run: |
          [ -d screenshots ] || exit 0
          sudo apt-get install -y -qq imagemagick > /dev/null
          echo "::group::Capturas em base64 (JPEG 360 px)"
          for f in screenshots/*.png; do
            echo "=== CAPTURA $(basename "$f" .png) ==="
            convert "$f" -resize 360x -quality 70 jpg:- | base64 -w 0
            echo
          done
          echo "::endgroup::"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ matrix.app }}-android-screenshots
          path: mobile/apps/${{ matrix.app }}/screenshots/
          if-no-files-found: warn
          retention-days: 14

  ios:
    name: Simulador iOS (${{ matrix.app }})
    runs-on: macos-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        app: [oficina, entregador]
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
        working-directory: mobile
      - name: Iniciar simulador de iPhone
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available --json | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          iphones = [d for runtime, ds in devices.items() if "iOS" in runtime for d in ds if d["name"].startswith("iPhone")]
          print(iphones[-1]["udid"])')
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
      - name: Fluxo de demonstração no simulador
        working-directory: mobile/apps/${{ matrix.app }}
        run: flutter drive --driver=test_driver/integration_test.dart --target=integration_test/demo_flow_test.dart -d ${{ steps.sim.outputs.udid }}
      - name: Capturas reduzidas no log (revisão remota)
        if: always()
        working-directory: mobile/apps/${{ matrix.app }}
        run: |
          [ -d screenshots ] || exit 0
          echo "::group::Capturas em base64 (JPEG 360 px)"
          for f in screenshots/*.png; do
            echo "=== CAPTURA $(basename "$f" .png) ==="
            sips -s format jpeg -s formatOptions 70 --resampleWidth 360 "$f" --out /tmp/captura.jpg > /dev/null
            base64 -i /tmp/captura.jpg
            echo
          done
          echo "::endgroup::"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ matrix.app }}-ios-screenshots
          path: mobile/apps/${{ matrix.app }}/screenshots/
          if-no-files-found: warn
          retention-days: 14

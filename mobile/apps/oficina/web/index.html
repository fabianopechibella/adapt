<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <!-- Substituído por --base-href no build (ex.: /oficina/ quando servido em subpasta). -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Peça certa, na oficina, rápido: identifique a peça pela placa, compare ofertas e acompanhe a entrega.">
  <meta name="theme-color" content="#0B5FFF">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Oficina">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="manifest" href="manifest.json">

  <title>Autopeças Oficina</title>
  <style>
    html, body { height: 100%; margin: 0; background: #F7F8FC; }
    #carregando {
      position: fixed; inset: 0; display: flex; flex-direction: column; gap: 16px;
      align-items: center; justify-content: center;
      font: 15px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: #44474F;
    }
    #carregando .anel {
      width: 36px; height: 36px; border-radius: 50%;
      border: 4px solid #D9E2FF; border-top-color: #0B5FFF; animation: girar 0.9s linear infinite;
    }
    @keyframes girar { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { #carregando .anel { animation: none; } }
  </style>
</head>
<body>
  <!-- O primeiro carregamento baixa ~3–4 MB; o indicador some no primeiro quadro do Flutter. -->
  <div id="carregando" role="status" aria-live="polite">
    <div class="anel" aria-hidden="true"></div>
    <span>Carregando Autopeças Oficina…</span>
  </div>
  <noscript>Ative o JavaScript para usar o Autopeças Oficina.</noscript>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var el = document.getElementById('carregando');
      if (el) el.remove();
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
